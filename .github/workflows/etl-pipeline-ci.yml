name: etl-pipeline CI

on:
  push:
    branches: [main]
    paths: ["etl-pipeline/**"]
  pull_request:
    paths: ["etl-pipeline/**"]

defaults:
  run:
    working-directory: etl-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: etl-pipeline/requirements.txt

      - run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (sanity check)
        run: docker build -t etl-pipeline:ci .
        working-directory: etl-pipeline