name: orchestration CI

on:
  push:
    branches: [main]
    paths: ["orchestration/**", ".github/workflows/orchestration-ci.yml"]
  pull_request:
    paths: ["orchestration/**", ".github/workflows/orchestration-ci.yml"]

defaults:
  run:
    working-directory: orchestration

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: orchestration/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest tests/